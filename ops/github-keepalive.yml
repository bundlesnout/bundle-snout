name: keepalive
# Backstop that WAKES the free Render service if it ever spun down (the app also self-pings every 10 min
# while running). GitHub's scheduler is best-effort, so runs can be delayed; that's fine as a backstop.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}
concurrency: { group: keepalive, cancel-in-progress: true }
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /healthz (retries cover the ~1 min cold start)
        run: curl -fsS --retry 5 --retry-delay 15 --retry-all-errors --max-time 90 "https://bundle-snout.onrender.com/healthz?src=gha"
