# Render Blueprint — free web service (UI + API + Telegram webhook in one process)
services:
  - type: web
    name: bundle-snout
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install --omit=dev --no-audit --no-fund
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: BOT_MODE
        value: webhook
      - key: TELEGRAM_BOT_TOKEN
        sync: false        # pegar a mano en el dashboard (secreto)
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      - key: RPC_URL
        sync: false        # p.ej. https://mainnet.helius-rpc.com/?api-key=XXXX
